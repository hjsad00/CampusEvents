
# ==================================
# CONFIGURATION DU GATEWAY
# ==================================
spring.application.name=api-gateway
server.port=8088

# ==================================
# CONFIGURATION EUREKA
# ==================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==================================
# CONFIGURATION DYNAMIQUE DES ROUTES (avec Eureka / lb://)
# ==================================

# Route vers venue-service
spring.cloud.gateway.routes[0].id=venue-service
spring.cloud.gateway.routes[0].uri=lb://venue-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/venues/**

# Route vers registration-service
spring.cloud.gateway.routes[1].id=registration-service
spring.cloud.gateway.routes[1].uri=lb://registration-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/registrations/**

# ==================================
# LOGS DE ROUTAGE (debug)
# ==================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# ==================================
# ACTUATOR
# ==================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
